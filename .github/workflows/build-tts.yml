name: Build TTS Docker images

on:
  push:
    branches: [main, dev]
    tags:
      - v*
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_GPU: ${{ github.repository }}/tts
  IMAGE_NAME_CPU: ${{ github.repository }}/tts-cpu

jobs:
  build-tts-gpu:
    name: Build TTS (GPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag matches VERSION (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="v$(cat TTS/VERSION)"
          if [[ "${{ github.ref }}" != "refs/tags/${VERSION}" ]]; then
            echo "Pushed tag does not match TTS/VERSION (expected ${VERSION}). Aborting."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_GPU }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push TTS (GPU)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: BASE=nvidia/cuda:11.8.0-base-ubuntu22.04
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tts-gpu
          cache-to: type=gha,mode=max,scope=tts-gpu
          platforms: linux/amd64

  build-tts-cpu:
    name: Build TTS (CPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag matches VERSION (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="v$(cat TTS/VERSION)"
          if [[ "${{ github.ref }}" != "refs/tags/${VERSION}" ]]; then
            echo "Pushed tag does not match TTS/VERSION (expected ${VERSION}). Aborting."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_CPU }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push TTS (CPU)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: BASE=python:3.10.8-slim
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tts-cpu
          cache-to: type=gha,mode=max,scope=tts-cpu
          platforms: linux/amd64
